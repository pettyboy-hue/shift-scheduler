<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>排班助手</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <h1>📋 排班助手</h1>
            <p class="subtitle">固定班次 · 大小休 · 智能调休</p>
        </header>

        <!-- 员工花名册 -->
        <div class="roster">
            <div class="roster-shift morning">
                <div class="roster-title">☀️ 早班 <span>09:00-18:00</span></div>
                <div class="roster-people">罗凯</div>
                <div class="roster-rule">工作日1人 · 周末视业务0~1人</div>
            </div>
            <div class="roster-shift middle">
                <div class="roster-title">🌤️ 中班 <span>16:00-次日01:00</span></div>
                <div class="roster-people">陈力 · 柳鹏</div>
                <div class="roster-rule">工作日2人满员 · 大休周末1人 · 小休拆半</div>
            </div>
            <div class="roster-shift night">
                <div class="roster-title">🌙 晚班 <span>21:00-次日05:00</span></div>
                <div class="roster-people">袁继春 · 罗浩文 · 陈阳倩 · 罗森鹏</div>
                <div class="roster-rule">工作日2人轮换 · 大休周末1人 · 小休拆半</div>
            </div>
        </div>

        <!-- 控制面板 -->
        <div class="controls">
            <div class="ctrl-row">
                <div class="ctrl-item">
                    <label>📅 起始周一</label>
                    <input type="date" id="weekStart">
                </div>
                <div class="ctrl-item">
                    <label>🔄 本周类型</label>
                    <select id="weekType">
                        <option value="big">大休（双休：周六+周日）</option>
                        <option value="small">小休（单休：同班次拆半轮休）</option>
                    </select>
                </div>
                <div class="ctrl-item">
                    <label>📊 周末业务</label>
                    <select id="bizLevel">
                        <option value="normal">正常</option>
                        <option value="light">宽松（白班可空）</option>
                        <option value="busy">繁忙（尽量满员）</option>
                    </select>
                </div>
                <button id="generateBtn" class="btn-gen">🚀 生成排班</button>
            </div>

            <!-- 特殊情况 -->
            <details class="special-section">
                <summary>📝 特殊情况（调休/请假）</summary>
                <div id="specialArea"></div>
            </details>
        </div>

        <!-- 排班结果 -->
        <div id="resultArea" style="display:none">
            <!-- 预警 -->
            <div id="warnings" class="warnings" style="display:none"></div>

            <!-- 排班表 -->
            <div class="result-header">
                <h2 id="resultTitle">排班表</h2>
                <div class="view-btns">
                    <button class="vbtn active" data-view="person">👤 人员视图</button>
                    <button class="vbtn" data-view="shift">🕐 班次视图</button>
                </div>
            </div>
            <div class="edit-tip">💡 点击表格中的「班次标签」或「休」可以切换状态，修改后下方分析自动更新</div>
            <div id="tableArea"></div>

            <!-- 休息分析 -->
            <div class="analysis">
                <h2>📊 休息分析</h2>
                <div id="restSummary" class="rest-summary"></div>
                <div id="suggestions" class="suggestions"></div>
                <div id="detailTable"></div>
            </div>

            <!-- 导出 -->
            <div class="export-bar">
                <button id="exportBtn" class="btn-export">📥 导出CSV</button>
                <button id="copyBtn" class="btn-export">📋 复制文本</button>
            </div>
        </div>
    </div>
    <script src="scheduler.js"></script>
    <script src="app.js"></script>
</body>
</html>
