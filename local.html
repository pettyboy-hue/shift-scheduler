<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>排班助手</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f0f2f5;color:#333;line-height:1.6;padding:20px}
.container{max-width:1400px;margin:0 auto}
.header{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;padding:24px 32px;border-radius:16px;margin-bottom:20px;box-shadow:0 4px 20px rgba(102,126,234,.3)}
.header h1{font-size:24px;margin-bottom:4px}
.header p{opacity:.85;font-size:14px}
.card{background:#fff;border-radius:12px;padding:24px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.card h2{font-size:16px;color:#444;margin-bottom:16px;padding-bottom:10px;border-bottom:2px solid #f0f0f0}
.shift-group{margin-bottom:14px}
.shift-group-title{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:15px;padding:6px 14px;border-radius:20px;margin-bottom:6px}
.shift-group-title.morning{background:#fff7e6;color:#d48806}
.shift-group-title.middle{background:#e6f7ff;color:#0070c0}
.shift-group-title.night{background:#f3e8ff;color:#722ed1}
.emp-tags{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 2px 12px}
.emp-tag{padding:4px 12px;border-radius:6px;font-size:13px;background:#fafafa;border:1px solid #e8e8e8;position:relative;cursor:default}
.emp-tag .gear-btn{display:none;position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:#667eea;color:#fff;font-size:10px;line-height:18px;text-align:center;cursor:pointer;border:none}
.emp-tag:hover .gear-btn{display:block}
.override-badge{display:inline-block;font-size:10px;background:#ff4d4f;color:#fff;padding:0 5px;border-radius:8px;margin-left:4px}
.link-card{background:linear-gradient(135deg,#e8f5e9,#f1f8e9);border:1px solid #a5d6a7;border-radius:10px;padding:16px;margin-bottom:16px}
.link-card h3{font-size:14px;color:#2e7d32;margin-bottom:10px}
.link-card .info{font-size:13px;color:#555;margin-bottom:6px}
.link-card .debt-tag{display:inline-block;background:#fff3e0;color:#e65100;padding:2px 8px;border-radius:4px;font-size:12px;margin:2px}
.link-card .actions{margin-top:10px;display:flex;gap:8px}
.link-card .actions button{padding:6px 16px;border-radius:6px;font-size:13px;cursor:pointer;border:none;font-weight:600}
.btn-apply{background:#4caf50;color:#fff}
.btn-ignore{background:#e0e0e0;color:#666}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:1000;justify-content:center;align-items:center}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:14px;padding:28px;width:340px;box-shadow:0 8px 30px rgba(0,0,0,.2)}
.modal h3{font-size:17px;margin-bottom:16px;text-align:center}
.modal .options{display:flex;flex-direction:column;gap:10px}
.shift-option{padding:14px 16px;border:2px solid #e8e8e8;border-radius:10px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:all .15s;font-size:14px}
.shift-option:hover{border-color:#667eea;background:#f8f7ff}
.shift-option.active{border-color:#667eea;background:#eef0ff;font-weight:600}
.shift-option .dot{width:12px;height:12px;border-radius:50%}
.shift-option .dot.morning{background:#faad14}
.shift-option .dot.middle{background:#1890ff}
.shift-option .dot.night{background:#722ed1}
.modal .actions{display:flex;gap:10px;margin-top:20px}
.modal .actions button{flex:1;padding:10px;border-radius:8px;font-size:14px;cursor:pointer;border:none;font-weight:600}
.btn-cancel{background:#f0f0f0;color:#666}
.btn-confirm{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
.btn-reset{background:#fff7e6;color:#d48806;border:1px solid #ffe58f!important}
.modal .tip{font-size:12px;color:#999;text-align:center;margin-top:12px}
.controls{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end}
.control-item{display:flex;flex-direction:column;gap:4px}
.control-item label{font-size:13px;color:#666;font-weight:500}
.control-item select,.control-item input[type="date"]{padding:8px 12px;border:1px solid #d9d9d9;border-radius:8px;font-size:14px;background:#fff;cursor:pointer}
.btn-generate{padding:10px 28px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap}
.btn-generate:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(102,126,234,.4)}
.week-configs{margin-top:16px;display:flex;flex-wrap:wrap;gap:12px}
.week-config-card{flex:1;min-width:200px;border:1px solid #e8e8e8;border-radius:10px;padding:14px;background:#fafafa}
.week-config-card h4{font-size:13px;color:#666;margin-bottom:8px}
.week-config-card select{width:100%;padding:6px 10px;border:1px solid #d9d9d9;border-radius:6px;font-size:13px;margin-bottom:6px}
.special-toggle{background:none;border:1px dashed #d9d9d9;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px;color:#666;width:100%;text-align:left;margin-top:12px}
.special-toggle:hover{border-color:#667eea;color:#667eea}
.special-panel{display:none;margin-top:12px;padding:16px;background:#fafafa;border-radius:8px}
.special-panel.open{display:block}
.leave-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:13px;flex-wrap:wrap}
.leave-row input[type="checkbox"]{width:16px;height:16px;cursor:pointer}
#result{display:none}
.week-section{margin-bottom:24px;border:1px solid #e8e8e8;border-radius:10px;padding:16px;background:#fefefe}
.week-section h3{font-size:14px;color:#555;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #f0f0f0}
.schedule-table{width:100%;border-collapse:collapse;font-size:14px}
.schedule-table th{padding:10px 8px;text-align:center;background:#fafafa;font-weight:600;border-bottom:2px solid #e8e8e8;font-size:13px}
.schedule-table th .date{font-size:12px;color:#999;font-weight:400}
.schedule-table th.weekend{color:#f5222d}
.schedule-table td{padding:8px;text-align:center;border-bottom:1px solid #f0f0f0}
.schedule-table td.name-cell{text-align:left;font-weight:600;padding-left:16px;white-space:nowrap}
.badge{display:inline-block;padding:4px 12px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;user-select:none;min-width:36px}
.badge:hover{transform:scale(1.1);box-shadow:0 2px 6px rgba(0,0,0,.15)}
.badge.morning{background:#fff7e6;color:#d48806;border:1px solid #ffe58f}
.badge.middle{background:#e6f7ff;color:#0070c0;border:1px solid #91d5ff}
.badge.night{background:#f3e8ff;color:#722ed1;border:1px solid #d3adf7}
.badge.rest{background:#f6ffed;color:#52c41a;border:1px solid #b7eb8f}
.rest-tag{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600;white-space:nowrap}
.rest-tag.double{background:#f6ffed;color:#389e0d}
.rest-tag.linked{background:#e6fffb;color:#08979c}
.rest-tag.single{background:#fffbe6;color:#d48806}
.rest-tag.split{background:#fff2e8;color:#d4380d}
.rest-tag.none{background:#fff1f0;color:#cf1322}
.group-sep td{padding:8px 16px;background:#f7f7f7;font-weight:600;font-size:13px;color:#666;text-align:left!important;border-bottom:2px solid #e8e8e8}
.stat-row td{background:#fafafa;font-size:12px;color:#888;padding:6px 8px}
.stat-row td.short{color:#cf1322;font-weight:600}
.stat-total td{border-top:2px solid #e8e8e8}
.analysis-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.pcard{padding:14px;border-radius:10px;border:1px solid #e8e8e8}
.pcard .pname{font-weight:600;font-size:15px;margin-bottom:4px}
.pcard .pshift{font-size:12px;color:#999;margin-bottom:8px}
.pcard .pstats{font-size:13px;color:#666}
.pcard .pstats div{margin-bottom:3px}
.suggestions{list-style:none;padding:0}
.suggestions li{padding:10px 14px;margin-bottom:6px;border-radius:8px;font-size:13px;display:flex;align-items:flex-start;gap:8px}
.suggestions li.warn{background:#fffbe6;border:1px solid #ffe58f;color:#ad6800}
.suggestions li.error{background:#fff1f0;border:1px solid #ffa39e;color:#a8071a}
.suggestions li.ok{background:#f6ffed;border:1px solid #b7eb8f;color:#389e0d}
.summary-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px}
.summary-table th,.summary-table td{padding:8px 12px;border:1px solid #e8e8e8;text-align:center}
.summary-table th{background:#fafafa;font-weight:600}
.summary-table td.warn-cell{background:#fffbe6;color:#d48806;font-weight:600}
.summary-table td.good-cell{background:#f6ffed;color:#389e0d}
.adjust-log{margin-top:12px;padding:12px;background:#fefbe8;border:1px solid #ffe58f;border-radius:8px}
.adjust-log h4{font-size:13px;color:#ad6800;margin-bottom:8px}
.adjust-log .log-item{font-size:12px;color:#666;padding:4px 0;border-bottom:1px dashed #f0e8c0}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);padding:10px 24px;background:#333;color:#fff;border-radius:8px;font-size:14px;opacity:0;transition:all .3s;z-index:999;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.btn-export{padding:8px 20px;border:none;border-radius:8px;font-size:13px;cursor:pointer;margin-right:8px;color:#fff}
.btn-export:hover{opacity:.85}
@media(max-width:768px){body{padding:10px}.controls{flex-direction:column}.schedule-table{font-size:12px}.badge{padding:3px 8px;font-size:11px;min-width:28px}.analysis-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
<div class="header"><h1>📋 排班助手</h1><p>固定班次 · 大小休4周循环 · 月份衔接 · 手动微调 · 欠休追踪</p></div>
<div class="card" id="empCard"></div>
<div id="linkArea"></div>
<div class="card">
<h2>⚙️ 排班设置</h2>
<div class="controls">
<div class="control-item"><label>📅 起始周一</label><input type="date" id="weekStart"></div>
<div class="control-item"><label>📏 排班范围</label>
<select id="spanWeeks" onchange="onSpanChange()"><option value="1">1周</option><option value="2">2周</option><option value="4" selected>4周（一个月）</option></select>
</div>
<button class="btn-generate" onclick="doGenerate()">🚀 生成排班</button>
</div>
<div class="week-configs" id="weekConfigs"></div>
<button class="special-toggle" onclick="toggleSpecial()">▶ 📝 特殊情况（调休/请假）点击展开</button>
<div class="special-panel" id="specialPanel"></div>
</div>
<div id="result">
<div class="card">
<h2 id="resultHeader">📊 排班结果</h2>
<div style="margin-bottom:12px">
<button class="btn-export" style="background:#52c41a" onclick="exportCSV()">📥 导出CSV</button>
<button class="btn-export" style="background:#1890ff" onclick="saveAndLink()">💾 保存并记录衔接</button>
</div>
<div id="weeksContainer"></div>
</div>
<div class="card"><h2>📊 周期总览</h2><div id="summaryArea"></div></div>
<div class="card"><h2>📋 调整追踪</h2><div id="adjustLog"></div></div>
<div class="card"><h2>🔍 休息状态一览</h2><div class="analysis-grid" id="analysisGrid"></div></div>
<div class="card"><h2>💡 智能建议</h2><ul class="suggestions" id="suggestions"></ul></div>
</div>
</div>
<div class="modal-overlay" id="shiftModal">
<div class="modal">
<h3 id="modalTitle">调整班次</h3>
<div class="options" id="modalOptions"></div>
<div class="actions">
<button class="btn-reset" id="modalReset" onclick="resetOverride()">恢复默认</button>
<button class="btn-cancel" onclick="closeModal()">取消</button>
<button class="btn-confirm" onclick="confirmOverride()">确认</button>
</div>
<div class="tip">⚠️ 仅影响排班周期，不改变默认固定班次</div>
</div>
</div>
<div class="toast" id="toast"></div>
<script>
const EMPS=[
{name:'罗凯',shift:'morning'},
{name:'陈力',shift:'middle'},
{name:'柳鹏',shift:'middle'},
{name:'袁继春',shift:'night'},
{name:'罗浩文',shift:'night'},
{name:'陈阳倩',shift:'night'},
{name:'罗森鹏',shift:'night'}
];
const SI={
morning:{label:'早',full:'早班',time:'09:00-18:00',emoji:'☀️',hours:9},
middle:{label:'中',full:'中班',time:'16:00-次日01:00',emoji:'🌤️',hours:9},
night:{label:'晚',full:'晚班',time:'21:00-次日05:00',emoji:'🌙',hours:8}
};
const WD=['周一','周二','周三','周四','周五','周六','周日'];
let overrides={},allWeeks=[],leaves={},adjustments=[],editIdx=null,tempShift=null;
/* 衔接状态 */
let linkState=null;
const $=id=>document.getElementById(id);
const fmt=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parse=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
const addD=(d,n)=>{const r=new Date(d);r.setDate(r.getDate()+n);return r};
const getShift=i=>overrides[i]||EMPS[i].shift;
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}

/* ====== 初始化 ====== */
(function(){
const t=new Date(),dow=t.getDay(),diff=dow===0?-6:1-dow;
const mon=new Date(t);mon.setDate(t.getDate()+diff);
$('weekStart').value=fmt(mon);
renderEmpCard();renderSpecialPanel();onSpanChange();
loadLinkState();
})();

/* ====== 衔接系统 ====== */
function loadLinkState(){
const raw=localStorage.getItem('shift_link');
if(!raw){$('linkArea').innerHTML='';return}
try{linkState=JSON.parse(raw)}catch(e){linkState=null;return}
renderLinkCard();
}

function renderLinkCard(){
if(!linkState){$('linkArea').innerHTML='';return}
const nextType=linkState.lastType==='big'?'small':'big';
const nextLabel=nextType==='big'?'大休（双休）':'小休（单休）';
let h='<div class="link-card"><h3>📎 检测到上期排班记录</h3>';
h+='<div class="info">📅 上期：'+linkState.startDate+' ~ '+linkState.endDate+'（共'+linkState.numWeeks+'周）</div>';
h+='<div class="info">🔄 上期末周类型：'+(linkState.lastType==='big'?'大休':'小休')+' → 本期首周建议：<strong>'+nextLabel+'</strong></div>';
h+='<div class="info">🔄 轮换位置：中班第'+linkState.rotIdx+'轮 · 晚班第'+linkState.rotIdx+'轮</div>';
/* 欠休 */
let hasDebt=false;
h+='<div class="info">💰 欠休继承：';
EMPS.forEach((e,i)=>{
const d=linkState.debt[i]||0;
if(d>0){h+='<span class="debt-tag">'+e.name+' +'+d+'天</span>';hasDebt=true}
});
if(!hasDebt)h+='<span style="color:#4caf50">无欠休 ✅</span>';
h+='</div>';
h+='<div class="actions"><button class="btn-apply" onclick="applyLink()">✅ 应用衔接</button>';
h+='<button class="btn-ignore" onclick="ignoreLink()">🔄 忽略，重新开始</button></div></div>';
$('linkArea').innerHTML=h;
}

function applyLink(){
if(!linkState)return;
/* 设置每周类型：从上期末周的反面开始交替 */
const n=+$('spanWeeks').value;
const startType=linkState.lastType==='big'?'small':'big';
for(let w=0;w<n;w++){
const el=$('wt_'+w);
if(el){
if(w%2===0)el.value=startType;
else el.value=startType==='big'?'small':'big';
}
}
/* 设置起始日期为上期结束后的下一个周一 */
const nextMon=addD(parse(linkState.endDate),1);
$('weekStart').value=fmt(nextMon);
toast('✅ 已应用上期衔接，大小休已自动交替');
}

function ignoreLink(){
linkState=null;
localStorage.removeItem('shift_link');
$('linkArea').innerHTML='';
toast('已忽略上期记录');
}

function saveAndLink(){
if(!allWeeks.length)return;
/* 计算每人在这一轮排班后的欠休余额 */
const debt={};
EMPS.forEach((e,i)=>{
const shouldRest=allWeeks.reduce((s,w)=>s+(w.type==='big'?2:w.type==='small'?1:2),0);
let actualRest=0;
allWeeks.forEach(wk=>{for(let d=0;d<7;d++)if(!wk.sched[i][d])actualRest++});
/* 继承上期欠休 */
const inherited=(linkState&&linkState.debt[i])||0;
debt[i]=Math.max(0,shouldRest-actualRest+inherited);
});
const lastWk=allWeeks[allWeeks.length-1];
const endDate=fmt(addD(lastWk.monday,6));
const state={
startDate:fmt(allWeeks[0].monday),
endDate:endDate,
numWeeks:allWeeks.length,
lastType:lastWk.type,
rotIdx:(linkState?linkState.rotIdx:0)+allWeeks.length,
debt:debt,
savedAt:new Date().toLocaleString('zh-CN')
};
localStorage.setItem('shift_link',JSON.stringify(state));
/* 也存历史 */
const h=JSON.parse(localStorage.getItem('shift_hist')||'[]');
h.unshift({start:fmt(allWeeks[0].monday),weeks:allWeeks.map(w=>({monday:fmt(w.monday),type:w.type,biz:w.biz,sched:w.sched})),adjustments,savedAt:state.savedAt});
if(h.length>20)h.pop();
localStorage.setItem('shift_hist',JSON.stringify(h));
linkState=state;
renderLinkCard();
toast('💾 已保存！下次排班将自动衔接本期');
}

/* ====== 员工卡片 ====== */
function renderEmpCard(){
const g={morning:[],middle:[],night:[]};
EMPS.forEach((e,i)=>g[getShift(i)].push(i));
let h='<h2>👥 当前排班人员 <span style="font-size:12px;color:#999;font-weight:400">（鼠标悬停点⚙可临时调班）</span></h2>';
for(const[s,idxs] of Object.entries(g)){
if(!idxs.length)continue;
const si=SI[s];
h+='<div class="shift-group"><div class="shift-group-title '+s+'">'+si.emoji+' '+si.full+' '+si.time+'</div>';
h+='<div class="emp-tags">';
for(const i of idxs){
h+='<span class="emp-tag">'+EMPS[i].name+(overrides[i]?'<span class="override-badge">临</span>':'');
h+='<button class="gear-btn" onclick="openModal('+i+')">⚙</button></span>';
}
h+='</div></div>';
}
$('empCard').innerHTML=h;
}

/* ====== 多周配置 ====== */
function onSpanChange(){
const n=+$('spanWeeks').value;
/* 确定首周类型：有衔接状态就交替，没有就默认大小交替 */
let startType='big';
if(linkState)startType=linkState.lastType==='big'?'small':'big';
let h='';
for(let w=0;w<n;w++){
const def=w%2===0?startType:(startType==='big'?'small':'big');
const mon=addD(parse($('weekStart').value||fmt(new Date())),w*7);
h+='<div class="week-config-card"><h4>第'+(w+1)+'周 '+(mon.getMonth()+1)+'/'+mon.getDate()+'起</h4>';
h+='<select id="wt_'+w+'">';
h+='<option value="big"'+(def==='big'?' selected':'')+'>大休（双休2天）</option>';
h+='<option value="small"'+(def==='small'?' selected':'')+'>小休（单休1天）</option>';
h+='<option value="busy">繁忙（全员上，欠休后补）</option>';
h+='</select>';
h+='<select id="bz_'+w+'"><option value="normal">业务正常</option><option value="light">业务宽松</option></select>';
h+='</div>';
}
$('weekConfigs').innerHTML=h;
}

/* ====== 临时调班弹窗 ====== */
function openModal(i){
editIdx=i;tempShift=getShift(i);
$('modalTitle').textContent='调整 '+EMPS[i].name+' 的班次';
$('modalReset').style.display=overrides[i]?'block':'none';
let h='';
for(const[k,si] of Object.entries(SI)){
const act=k===tempShift?'active':'';
const def=k===EMPS[i].shift?' (默认)':'';
h+='<div class="shift-option '+act+'" onclick="pickShift(this,\''+k+'\')"><span class="dot '+k+'"></span><span>'+si.emoji+' '+si.full+' '+si.time+def+'</span></div>';
}
$('modalOptions').innerHTML=h;
$('shiftModal').classList.add('open');
}
function pickShift(el,s){document.querySelectorAll('.shift-option').forEach(o=>o.classList.remove('active'));el.classList.add('active');tempShift=s}
function confirmOverride(){
if(editIdx===null)return;
if(tempShift===EMPS[editIdx].shift)delete overrides[editIdx];else overrides[editIdx]=tempShift;
closeModal();renderEmpCard();
if(allWeeks.length)doGenerate();
toast(EMPS[editIdx].name+' → '+SI[getShift(editIdx)].full);
}
function resetOverride(){if(editIdx===null)return;delete overrides[editIdx];closeModal();renderEmpCard();if(allWeeks.length)doGenerate();toast(EMPS[editIdx].name+' 恢复默认')}
function closeModal(){$('shiftModal').classList.remove('open');editIdx=null}
function toggleSpecial(){$('specialPanel').classList.toggle('open')}
function renderSpecialPanel(){
let h='<p style="font-size:13px;color:#666;margin-bottom:10px">勾选有特殊情况的员工：</p>';
EMPS.forEach((e,i)=>{
h+='<div class="leave-row"><input type="checkbox" id="lv'+i+'">';
h+='<span style="min-width:60px;font-weight:600">'+e.name+'</span>';
h+='<select id="lt'+i+'"><option value="leave">请假</option><option value="dayoff">调休</option></select>';
h+='<span style="font-size:12px;color:#999">哪几天：</span>';
for(let d=0;d<7;d++)h+='<label style="font-size:12px"><input type="checkbox" class="ld'+i+'" value="'+d+'"> '+WD[d]+'</label>';
h+='</div>';
});
$('specialPanel').innerHTML=h;
}
function syncLeaves(){
leaves={};
EMPS.forEach((e,i)=>{
if(!$('lv'+i)||!$('lv'+i).checked)return;
const ds=[];document.querySelectorAll('.ld'+i).forEach(c=>{if(c.checked)ds.push(+c.value)});
if(ds.length)leaves[i]={type:$('lt'+i).value,days:ds};
});
}

/* ====== 核心排班算法 v12 ====== */
function doGenerate(){
const ds=$('weekStart').value;
if(!ds){toast('请先选择日期');return}
let d=parse(ds);
const dow=d.getDay(),diff=dow===0?-6:1-dow;
const startMon=addD(d,diff);
$('weekStart').value=fmt(startMon);
syncLeaves();
const numWeeks=+$('spanWeeks').value;
allWeeks=[];adjustments=[];
/* 继承上期欠休 */
let debt={};
EMPS.forEach((e,i)=>debt[i]=(linkState?linkState.debt[i]:0)||0);
/* 轮换起点 */
let rot=(linkState?linkState.rotIdx:0)||0;

for(let w=0;w<numWeeks;w++){
const wMon=addD(startMon,w*7);
const wType=$('wt_'+w)?$('wt_'+w).value:(w%2===0?'big':'small');
const bizLv=$('bz_'+w)?$('bz_'+w).value:'normal';
const sched=EMPS.map(()=>[true,true,true,true,true,true,true]);
/* 请假标记 */
for(const[idx,info] of Object.entries(leaves)){
for(const dd of info.days)sched[+idx][dd]=false;
}
if(wType==='busy'){
/* 繁忙全员上，累计欠休2天（大休标准） */
EMPS.forEach((e,i)=>{debt[i]+=2});
}else{
const groups={morning:[],middle:[],night:[]};
EMPS.forEach((e,i)=>groups[getShift(i)].push(i));
/* 每人本周应休 = 基础 + min(欠休,1) */
const target={};
EMPS.forEach((e,i)=>{
const base=wType==='big'?2:1;
const bonus=Math.min(debt[i],1);
target[i]=base+bonus;
});
schedMorning(groups.morning,target,sched,wType,bizLv);
schedMiddle(groups.middle,target,sched,wType,bizLv,rot+w);
schedNight(groups.night,target,sched,wType,bizLv,rot+w);
/* 扣减已补偿的欠休 */
EMPS.forEach((e,i)=>{
const base=wType==='big'?2:1;
const actual=cntRest(sched,i);
const compensated=actual-base;
if(compensated>0)debt[i]=Math.max(0,debt[i]-compensated);
});
}
allWeeks.push({monday:wMon,type:wType,biz:bizLv,sched});
}
renderAllWeeks();
$('result').style.display='block';
toast('✅ '+numWeeks+'周排班已生成');
}

/* ---- 早班（1人）---- */
function schedMorning(idxs,target,sched,wType,bizLv){
if(!idxs.length)return;
const i=idxs[0];
const t=target[i];
if(t>=2){
/* 双休：宽松→周六日，正常→周四五（周末在岗）*/
if(bizLv==='light'){off(sched,i,5);off(sched,i,6)}
else{off(sched,i,3);off(sched,i,4)}
if(t>=3)off(sched,i,bizLv==='light'?4:2); /* 补休 */
}else if(t>=1){
off(sched,i,6); /* 单休周日 */
}
}

/* ---- 中班（2人）---- */
function schedMiddle(idxs,target,sched,wType,bizLv,rot){
if(idxs.length<2)return;
/* 交替：a值班周末，b休周末 */
const a=idxs[rot%2],b=idxs[(rot+1)%2];
if(wType==='big'){
const tB=target[b],tA=target[a];
/* b休周六日（或含补休），a休工作日连休 */
if(tB>=2){off(sched,b,5);off(sched,b,6)}
if(tB>=3)off(sched,b,4);
if(tA>=2){off(sched,a,1);off(sched,a,2)}
if(tA>=3)off(sched,a,0);
}else{
/* 小休拆半：a周六休 b周日休 */
const tA=target[a],tB=target[b];
if(tA>=1)off(sched,a,5);
if(tB>=1)off(sched,b,6);
if(tA>=2)off(sched,a,1); /* 补休工作日 */
if(tB>=2)off(sched,b,2);
}
}

/* ---- 晚班（4人，工作日每天2人）---- */
function schedNight(idxs,target,sched,wType,bizLv,rot){
if(idxs.length<2)return;
const n=idxs.length;
if(wType==='big'){
/* 大休：4人各休2天连休，错开分布 */
const plans=[
[[0,1],[2,3],[4,5],[5,6]],
[[0,1],[2,3],[5,6],[4,5]],
[[5,6],[0,1],[2,3],[3,4]],
[[4,5],[5,6],[0,1],[2,3]],
[[1,2],[3,4],[5,6],[0,6]],
[[2,3],[4,5],[0,1],[5,6]]
];
let best=null;
for(let pi=0;pi<plans.length;pi++){
const p=plans[(pi+rot)%plans.length];
if(validatePlan(idxs,sched,p,target))
{best=p;break}
}
if(!best)best=plans[rot%plans.length];
for(let j=0;j<n&&j<best.length;j++){
const i=idxs[j],t=target[i];
if(t>=2){off(sched,i,best[j][0]);off(sched,i,best[j][1])}
else if(t>=1)off(sched,i,best[j][0]);
if(t>=3){
for(let d=0;d<7;d++){
if(sched[i][d]&&!best[j].includes(d)&&canOff(idxs,sched,i,d,2,1)){off(sched,i,d);break}
}
}
}
}else{
/* 小休：拆半均衡，前半周六后半周日 */
const half=Math.ceil(n/2);
const order=rotArr(idxs,rot);
for(let j=0;j<order.length;j++){
const i=order[j],t=target[i];
if(t<=0)continue;
if(j<half)off(sched,i,5);else off(sched,i,6);
if(t>=2){
for(let d=0;d<5;d++){
if(sched[i][d]&&canOff(idxs,sched,i,d,2,1)){off(sched,i,d);break}
}
}
}
}
}

function validatePlan(idxs,sched,plan,target){
const n=idxs.length;const offCnt=Array(7).fill(0);
for(let j=0;j<n&&j<plan.length;j++){
const i=idxs[j],t=target[i];
if(t>=2){offCnt[plan[j][0]]++;offCnt[plan[j][1]]++}
else if(t>=1)offCnt[plan[j][0]]++;
}
for(let d=0;d<7;d++){
let unavail=offCnt[d];
for(const i of idxs)if(!sched[i][d])unavail++;
const on=n-unavail;
if(d<5&&on<2)return false;
if(d>=5&&on<1)return false;
}
let s5=0,s6=0;
for(const i of idxs){if(!sched[i][5])s5++;if(!sched[i][6])s6++}
s5+=offCnt[5];s6+=offCnt[6];
if(Math.abs((n-s5)-(n-s6))>1)return false;
return true;
}

function canOff(idxs,sched,ei,d,wdN,weN){
let c=0;for(const i of idxs)if(i!==ei&&sched[i][d])c++;
return c>=(d<5?wdN:weN);
}
function rotArr(a,n){const r=n%a.length;return[...a.slice(r),...a.slice(0,r)]}
function cntRest(sched,i){let c=0;for(let d=0;d<7;d++)if(!sched[i][d])c++;return c}
function off(sched,i,d){sched[i][d]=false}

/* ====== 渲染 ====== */
function renderAllWeeks(){
let h='';
allWeeks.forEach((wk,wi)=>{
const end=addD(wk.monday,6);
const tl=wk.type==='big'?'大休（双休）':wk.type==='small'?'小休（单休）':'繁忙（全员上）';
h+='<div class="week-section"><h3>第'+(wi+1)+'周：'+(wk.monday.getMonth()+1)+'/'+wk.monday.getDate()+' - '+(end.getMonth()+1)+'/'+end.getDate()+' · '+tl+'</h3>';
h+='<div style="overflow-x:auto"><table class="schedule-table">';
h+=renderWeekTable(wk,wi);
h+='</table></div></div>';
});
$('weeksContainer').innerHTML=h;
renderSummary();renderAdjustLog();renderAnalysis();renderSuggestions();
}

function renderWeekTable(wk,wi){
const dates=[];for(let i=0;i<7;i++)dates.push(addD(wk.monday,i));
let h='<thead><tr><th style="min-width:80px">姓名</th>';
dates.forEach((d,i)=>{h+='<th class="'+(i>=5?'weekend':'')+'">'+WD[i]+'<br><span class="date">'+(d.getMonth()+1)+'/'+d.getDate()+'</span></th>'});
h+='<th style="min-width:90px">本周状态</th></tr></thead><tbody>';
const gm={morning:[],middle:[],night:[]};
EMPS.forEach((e,i)=>gm[getShift(i)].push(i));
for(const s of['morning','middle','night']){
const idxs=gm[s];if(!idxs.length)continue;
const si=SI[s];
h+='<tr class="group-sep"><td colspan="9">'+si.emoji+' '+si.full+' '+si.time+'</td></tr>';
for(const i of idxs){
const a=analyzeOne(wk.sched,i);
h+='<tr><td class="name-cell">'+EMPS[i].name+'</td>';
for(let d=0;d<7;d++){
if(wk.sched[i][d])h+='<td><span class="badge '+s+'" onclick="toggleCell('+wi+','+i+','+d+')">'+si.label+'</span></td>';
else h+='<td><span class="badge rest" onclick="toggleCell('+wi+','+i+','+d+')">休</span></td>';
}
h+='<td>'+statusTag(a)+'</td></tr>';
}
}
/* 统计行 */
h+='<tr class="stat-row stat-total"><td style="text-align:right;font-weight:600">在岗总人数</td>';
for(let d=0;d<7;d++){let c=0;EMPS.forEach((e,i)=>{if(wk.sched[i][d])c++});h+='<td>'+c+'人</td>'}
h+='<td></td></tr>';
for(const s of['morning','middle','night']){
const idxs=gm[s];if(!idxs.length)continue;
const si=SI[s];const wdN=s==='morning'?1:2;
const weN=s==='morning'?(wk.biz==='light'?0:1):1;
h+='<tr class="stat-row"><td style="text-align:right;font-size:11px">'+si.label+'班</td>';
for(let d=0;d<7;d++){
let c=0;for(const i of idxs)if(wk.sched[i][d])c++;
const need=d<5?wdN:(wk.type==='busy'?wdN:weN);
h+='<td class="'+(c<need?'short':'')+'">'+c+'/'+need+'人</td>';
}
h+='<td></td></tr>';
}
return h+'</tbody>';
}

function toggleCell(wi,ei,d){
const before=allWeeks[wi].sched[ei][d];
allWeeks[wi].sched[ei][d]=!before;
const wk=allWeeks[wi];const dt=addD(wk.monday,d);
adjustments.push({emp:EMPS[ei].name,week:wi+1,day:WD[d],date:(dt.getMonth()+1)+'/'+dt.getDate(),from:before?'上班':'休息',to:before?'休息':'上班'});
renderAllWeeks();
toast(EMPS[ei].name+' '+WD[d]+' → '+(allWeeks[wi].sched[ei][d]?'上班':'休息'));
}

/* ====== 分析 ====== */
function analyzeOne(sched,i){
const rest=[],work=[];
for(let d=0;d<7;d++){if(sched[i][d])work.push(d);else rest.push(d)}
let type,label;
if(rest.length===0){type='none';label='⛔ 无休'}
else if(rest.length===1){type='single';label='🟡 单休'}
else{
const sorted=[...rest].sort((a,b)=>a-b);
let linked=false;
for(let j=0;j<sorted.length-1;j++)if(sorted[j+1]-sorted[j]===1)linked=true;
if(sorted.includes(0)&&sorted.includes(6))linked=true;
if(rest.length===2){
if(sorted[0]===5&&sorted[1]===6){type='double';label='🟢 双休'}
else if(linked){type='linked';label='🔵 连休'}
else{type='split';label='🟠 拆休'}
}else{
type=linked?'linked':'split';
label=(linked?'🔵 连休':'🟠 拆休')+rest.length+'天';
}
}
const desc=rest.map(d=>WD[d]).join('+');
let maxCon=0,cur=0;
for(let d=0;d<7;d++){if(sched[i][d]){cur++;maxCon=Math.max(maxCon,cur)}else cur=0}
return{rest,work,type,label,desc,maxCon,totalWork:work.length,totalRest:rest.length};
}
function statusTag(a){return'<span class="rest-tag '+a.type+'">'+a.label+'<div style="font-size:10px;color:#999">'+a.desc+'</div></span>'}

/* ====== 总览 ====== */
function renderSummary(){
let h='<table class="summary-table"><thead><tr><th>姓名</th><th>班次</th>';
allWeeks.forEach((w,i)=>h+='<th>第'+(i+1)+'周</th>');
h+='<th>总上班</th><th>总休息</th><th>应休</th><th>继承欠休</th><th>差额</th><th>状态</th></tr></thead><tbody>';
EMPS.forEach((e,i)=>{
const si=SI[getShift(i)];
let tw=0,tr=0,shouldRest=0;
const inherited=(linkState?linkState.debt[i]:0)||0;
h+='<tr><td style="font-weight:600">'+e.name+'</td><td>'+si.emoji+si.label+'</td>';
allWeeks.forEach(wk=>{
const a=analyzeOne(wk.sched,i);
tw+=a.totalWork;tr+=a.totalRest;
shouldRest+=wk.type==='big'?2:wk.type==='small'?1:2;
h+='<td>'+statusTag(a)+'</td>';
});
const totalShould=shouldRest+inherited;
const diff=tr-totalShould;
const cls=diff<0?'warn-cell':diff===0?'good-cell':'';
const sta=diff===0?'✅达标':diff>0?'ℹ️多休'+diff+'天':'⚠️欠休'+(-diff)+'天';
h+='<td>'+tw+'天</td><td>'+tr+'天</td><td>'+shouldRest+'天</td>';
h+='<td>'+(inherited>0?inherited+'天':'0')+'</td>';
h+='<td class="'+cls+'">'+diff+'天</td><td>'+sta+'</td></tr>';
});
h+='</tbody></table>';
$('summaryArea').innerHTML=h;
}

/* ====== 调整追踪 ====== */
function renderAdjustLog(){
if(!adjustments.length){
$('adjustLog').innerHTML='<div style="color:#999;font-size:13px;text-align:center;padding:12px">暂无手动调整。点击标签可修改。</div>';return;
}
let h='<div class="adjust-log"><h4>📋 手动调整记录（'+adjustments.length+'次）</h4>';
const balance={};
EMPS.forEach((e,i)=>balance[i]=0);
adjustments.forEach(a=>{
const idx=EMPS.findIndex(e=>e.name===a.emp);
if(idx>=0){
if(a.from==='休息'&&a.to==='上班')balance[idx]--;
if(a.from==='上班'&&a.to==='休息')balance[idx]++;
}
});
adjustments.forEach(a=>{
h+='<div class="log-item">'+(a.to==='上班'?'⚠️':'✅')+' <strong>'+a.emp+'</strong> 第'+a.week+'周'+a.day+'('+a.date+') '+a.from+'→'+a.to+'</div>';
});
h+='<div style="margin-top:10px;padding-top:8px;border-top:1px solid #e8d890"><strong>累计影响：</strong>';
let hasImpact=false;
EMPS.forEach((e,i)=>{
if(balance[i]!==0){
hasImpact=true;
const c=balance[i]<0?'#cf1322':'#389e0d';
const t=balance[i]>0?'多休'+balance[i]+'天':'欠休'+(-balance[i])+'天';
h+='<span style="margin-right:12px;color:'+c+'">'+e.name+' '+t+'</span>';
}
});
if(!hasImpact)h+='<span style="color:#999">无净影响</span>';
h+='</div></div>';
$('adjustLog').innerHTML=h;
}

function renderAnalysis(){
let h='';
EMPS.forEach((e,i)=>{
const si=SI[getShift(i)];
let tw=0,tr=0;
const weekLines=allWeeks.map((wk,wi)=>{
const a=analyzeOne(wk.sched,i);tw+=a.totalWork;tr+=a.totalRest;
return'<div style="font-size:11px;margin:2px 0">W'+(wi+1)+': '+a.label+' '+a.desc+'</div>';
}).join('');
h+='<div class="pcard"><div class="pname">'+e.name+'</div>';
h+='<div class="pshift">'+si.emoji+' '+si.full+'</div>';
h+='<div class="pstats"><div>📅 上班<strong>'+tw+'</strong>天 休息<strong>'+tr+'</strong>天</div></div>'+weekLines+'</div>';
});
$('analysisGrid').innerHTML=h;
}

function renderSuggestions(){
const ss=[];
EMPS.forEach((e,i)=>{
let totalRest=0;
allWeeks.forEach((wk,wi)=>{
const a=analyzeOne(wk.sched,i);totalRest+=a.totalRest;
if(a.type==='none')ss.push({lv:'error',t:e.name+' 第'+(wi+1)+'周无休息！'});
if(a.type==='split')ss.push({lv:'warn',t:e.name+' 第'+(wi+1)+'周休息拆开（'+a.desc+'），建议调成连休'});
if(a.maxCon>=6)ss.push({lv:'error',t:e.name+' 第'+(wi+1)+'周连续工作'+a.maxCon+'天'});
});
const shouldRest=allWeeks.reduce((s,w)=>s+(w.type==='big'?2:w.type==='small'?1:2),0);
const inherited=(linkState?linkState.debt[i]:0)||0;
const diff=totalRest-(shouldRest+inherited);
if(diff<=-2)ss.push({lv:'error',t:e.name+' 周期内少休'+(-diff)+'天，急需补休！'});
else if(diff===-1)ss.push({lv:'warn',t:e.name+' 少休1天，建议后续补休'});
if(inherited>0)ss.push({lv:'warn',t:e.name+' 从上期继承'+inherited+'天欠休，本期需补偿'});
});
/* 缺员检查 */
const gm={morning:[],middle:[],night:[]};
EMPS.forEach((e,i)=>gm[getShift(i)].push(i));
allWeeks.forEach((wk,wi)=>{
for(const s of['morning','middle','night']){
const idxs=gm[s];if(!idxs.length)continue;
const wdN=s==='morning'?1:2;const weN=s==='morning'?(wk.biz==='light'?0:1):1;
for(let d=0;d<7;d++){
let c=0;for(const ii of idxs)if(wk.sched[ii][d])c++;
const need=d<5?wdN:(wk.type==='busy'?wdN:weN);
if(c<need)ss.push({lv:'warn',t:'第'+(wi+1)+'周'+WD[d]+SI[s].full+'缺'+(need-c)+'人'});
}
}
});
if(allWeeks.length===4){
const types=allWeeks.map(w=>w.type);
const bc=types.filter(t=>t==='big').length,sc=types.filter(t=>t==='small').length;
if(bc!==2||sc!==2)ss.push({lv:'warn',t:'当前4周：大休'+bc+'次、小休'+sc+'次、繁忙'+(4-bc-sc)+'次。标准2大+2小，繁忙欠休已追踪。'});
}
if(!ss.length)ss.push({lv:'ok',t:'✅ 排班良好！休息均衡，班次覆盖充足。'});
$('suggestions').innerHTML=ss.map(s=>'<li class="'+s.lv+'"><span>'+(s.lv==='error'?'🔴':s.lv==='warn'?'🟡':'🟢')+'</span><span>'+s.t+'</span></li>').join('');
}

/* ====== 导出 ====== */
function exportCSV(){
if(!allWeeks.length)return;
let csv='\uFEFF';
allWeeks.forEach((wk,wi)=>{
csv+='第'+(wi+1)+'周 ('+(wk.type==='big'?'大休':wk.type==='small'?'小休':'繁忙')+')\n';
csv+='姓名';
for(let d=0;d<7;d++){const dt=addD(wk.monday,d);csv+=','+WD[d]+'('+(dt.getMonth()+1)+'/'+dt.getDate()+')';}
csv+=',状态\n';
EMPS.forEach((e,i)=>{
csv+=e.name;
for(let d=0;d<7;d++)csv+=','+(wk.sched[i][d]?SI[getShift(i)].label+'班':'休息');
const a=analyzeOne(wk.sched,i);csv+=','+a.desc+'\n';
});csv+='\n';
});
const b=new Blob([csv],{type:'text/csv;charset=utf-8;'});
const a=document.createElement('a');a.href=URL.createObjectURL(b);
a.download='排班表_'+fmt(allWeeks[0].monday)+'.csv';a.click();
toast('📥 已导出CSV');
}
</script>
